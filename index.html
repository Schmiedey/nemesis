<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEMESIS</title>
<style>
:root{--red:#ff3b5c;--green:#7dffb0;--gold:#ffd23f;--ink:#050508;--panel:#12121a;--line:#2a2a38;--dim:#9a9aae}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:#eee}
canvas{display:block;touch-action:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;background:rgba(8,8,12,.88);text-align:center;gap:16px;padding:20px;overflow:auto}
.hidden{display:none!important}
.soft{background:rgba(8,8,12,.7)}
.menu{background:radial-gradient(ellipse at 50% 38%,#2a0b16 0%,#0a0a10 55%,var(--ink) 100%)}
.menu::before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff06 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#ffffff06 1px,transparent 1px) 0 0/40px 40px;pointer-events:none}
.menu>*{position:relative}
h2{font-size:34px;margin:0;letter-spacing:3px}
.sub{color:var(--dim);font-size:15px;max-width:560px;line-height:1.5}
.sub b{color:#fff}
.big{font-size:20px}
.key{display:inline-block;border:1px solid #555;border-bottom-width:3px;border-radius:5px;padding:1px 8px;color:#fff;font-size:.9em}
.pulse{animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}

/* Logo: red wordmark with a green reflection. What kills you (red) joins you (green). */
.logo{font:900 96px/0.9 Impact,'Arial Black',sans-serif;letter-spacing:14px;margin:0 0 .5em;padding-left:14px;position:relative;
  background:linear-gradient(#fff 5%,var(--red) 60%,#8a1230);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #ff3b5c77)}
.logo::after{content:attr(data-t);position:absolute;left:0;top:100%;padding-left:14px;transform:scaleY(-1);margin-top:-.14em;
  background:linear-gradient(transparent 45%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.45;pointer-events:none}
.logo.sm{font-size:56px;letter-spacing:8px}
.logo.win{background-image:linear-gradient(#fff 5%,var(--green) 60%,#1c7a4a);filter:drop-shadow(0 0 22px #7dffb077)}
.tag{color:#fff;font-size:17px;letter-spacing:1px}
.tag em{font-style:normal;color:var(--red)}.tag i{font-style:normal;color:var(--green)}

.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{background:var(--panel);border:1px solid #444;color:#ddd;border-radius:8px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer;transition:.12s}
button:hover{border-color:#fff;color:#fff;transform:translateY(-2px)}
button.go{background:var(--red);border-color:var(--red);color:#fff;font-weight:bold;font-size:18px;padding:12px 30px;box-shadow:0 0 24px #ff3b5c55}
button.go:hover{background:#ff5874}
button.quiet{background:none;border-color:var(--line);color:#777;font-size:12px;padding:6px 12px}
button .key{margin-left:8px;font-size:11px;opacity:.8}

/* Animated creature portrait cut from a sprite sheet (8 frames in a row). */
.spr{display:inline-block;flex:none;width:var(--s,48px);height:var(--s,48px);background-size:calc(var(--s,48px)*8) var(--s,48px);background-repeat:no-repeat;animation:spr .57s steps(8) infinite}
@keyframes spr{to{background-position-x:calc(var(--s,48px)*-8)}}

.slots{display:flex;gap:10px;justify-content:center}
.slot{width:170px;height:56px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:#555;text-align:left;box-sizing:border-box}
.slot.full{border:1px solid var(--green);background:#0f1a15;color:#ddd;box-shadow:0 0 12px #7dffb022}
.slot b{display:block;font-size:13px}.slot span{font-size:11px;color:var(--dim)}
.stats{display:flex;gap:10px;justify-content:center}
.stat{min-width:92px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.stat b{display:block;font-size:22px;color:#fff}.stat span{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.stat.best b{color:var(--gold)}
.how{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--dim)}

.roster{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:920px;max-height:46vh;overflow:auto;padding:4px}
.nem{width:210px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;font-size:12px;color:#aaa;transition:.12s;box-sizing:border-box;position:relative}
.nem:hover{border-color:#666}
.nem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.nem.on{border-color:var(--green);box-shadow:0 0 12px #7dffb044;background:#0f1a15}
.nem b{font-size:14px}.nem .perks{color:var(--gold)}.nem .pick{color:#666;font-size:11px}.nem.on .pick{color:var(--green)}
.nem.show{cursor:default;width:360px;padding:14px}
.stamp{position:absolute;right:10px;top:10px;border:2px solid var(--green);color:var(--green);background:#07120c;font-weight:bold;font-size:13px;letter-spacing:2px;padding:3px 8px;border-radius:4px;transform:rotate(8deg);animation:stamp .45s .5s cubic-bezier(.2,2,.4,1) backwards}
.stamp.no{border-color:#666;color:#888;background:#111}
@keyframes stamp{from{transform:rotate(8deg) scale(3);opacity:0}}
.killer{display:flex;align-items:center;gap:6px;justify-content:center}
.killer .spr{filter:drop-shadow(0 0 14px var(--c))}

.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{width:180px;padding:20px 14px;border:1px solid #444;border-radius:10px;background:#15151f;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--gold);transform:translateY(-4px)}
.card b{display:block;font-size:18px;margin-bottom:8px;color:var(--gold)}
.card span{color:#bbb;font-size:13px}
.card.ally b{color:var(--green)}
/* Touch: a stick that appears where the thumb lands, and a pause button. */
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #ffffff33;background:#ffffff0d;pointer-events:none;z-index:4}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffff55}
#bPause{position:fixed;right:12px;top:12px;z-index:5;font-size:16px;padding:8px 14px}
#rotate{display:none;z-index:9;background:var(--ink)}
.touch-only{display:none}
@media (pointer:coarse){
  button .key,.mouse-only{display:none}
  .touch-only{display:initial}
  button{padding:12px 20px}
}
@media (pointer:fine){#bPause{display:none}}
@media (pointer:coarse) and (orientation:portrait){#rotate{display:flex}}
@media (max-height:480px){
  .ov{gap:8px;padding:10px}
  .logo{font-size:46px!important;letter-spacing:8px;margin-bottom:.35em}
  .logo.sm{font-size:34px!important}
  .tag{font-size:14px}.sub{font-size:13px}.big{font-size:16px}
  h2{font-size:24px}
  .slot{height:46px;width:150px}.stat{padding:4px 10px;min-width:70px}.stat b{font-size:17px}
  .how{display:none}
  .card{width:150px;padding:12px 10px}.card b{font-size:15px}
  .roster{max-height:38vh}
  .killer .spr{--s:64px!important}
}
@media (max-height:640px){.logo{font-size:64px}.ov{gap:10px}}
</style></head><body>
<canvas id="c"></canvas>

<div id="start" class="ov menu hidden">
  <h1 class="logo" data-t="NEMESIS">NEMESIS</h1>
  <div class="tag">Whatever <em>kills you</em>, <i>joins you</i>.</div>
  <div class="slots" id="startParty"></div>
  <div class="sub" id="startBoss"></div>
  <div class="btns">
    <button class="go" id="bPlay">START RUN <span class="key">SPACE</span></button>
    <button id="bRoster">ROSTER <span class="key">R</span></button>
  </div>
  <div class="stats" id="startStats"></div>
  <div class="how"><span class="mouse-only"><span class="key">WASD</span> / <span class="key">Arrows</span> move</span><span class="touch-only">drag anywhere to move</span><span>aim is automatic</span><span class="mouse-only"><span class="key">Esc</span> pause</span></div>
</div>

<div id="roster" class="ov menu hidden">
  <h1 class="logo sm" data-t="ROSTER">ROSTER</h1>
  <div class="sub" id="rosterHint"></div>
  <div class="slots" id="rosterParty"></div>
  <div class="roster" id="rosterList"></div>
  <div class="btns">
    <button class="go" id="bRosterPlay">START RUN <span class="key">SPACE</span></button>
    <button id="bBack">BACK <span class="key">Esc</span></button>
  </div>
  <button class="quiet" id="reset">forget all nemeses</button>
</div>

<div id="dead" class="ov hidden">
  <div class="killer" id="dKiller"></div>
  <h2 id="dTitle"></h2>
  <div class="roster" id="dCard"></div>
  <div class="sub big" id="dJoin"></div>
  <div class="stats" id="dStats"></div>
  <div class="sub" id="dTease"></div>
  <div class="btns">
    <button class="go" id="bAgain">GO AGAIN <span class="key">SPACE</span></button>
    <button id="bDeadRoster">ROSTER <span class="key">R</span></button>
    <button id="bDeadMenu">MENU <span class="key">Esc</span></button>
  </div>
</div>

<div id="won" class="ov hidden">
  <h1 class="logo sm win" data-t="NEMESIS SLAIN">NEMESIS SLAIN</h1>
  <div class="stats" id="wStats"></div>
  <div class="sub big" id="wNote"></div>
  <div class="roster" id="wParty"></div>
  <div class="btns">
    <button class="go" id="bWonAgain">GO AGAIN <span class="key">SPACE</span></button>
    <button id="bWonRoster">ROSTER <span class="key">R</span></button>
    <button id="bWonMenu">MENU <span class="key">Esc</span></button>
  </div>
</div>

<div id="lvl" class="ov soft hidden">
  <h2 style="color:var(--gold)">LEVEL UP</h2>
  <div class="cards" id="cards"></div>
  <div class="sub mouse-only">Click or press <span class="key">1</span> <span class="key">2</span> <span class="key">3</span></div><div class="sub touch-only">Tap one</div>
</div>

<div id="pause" class="ov soft hidden">
  <h2>PAUSED</h2>
  <div class="btns">
    <button class="go" id="bResume">RESUME <span class="key">Esc</span></button>
    <button id="bQuit">QUIT TO MENU <span class="key">Q</span></button>
  </div>
</div>

<div id="joy" class="hidden"><i></i></div>
<button id="bPause" class="hidden" aria-label="Pause">II</button>
<div id="rotate" class="ov"><h2>Turn your phone sideways</h2><div class="sub">NEMESIS plays in landscape.</div></div>
<button class="quiet" id="mute" style="position:fixed;right:12px;bottom:12px;z-index:5"></button>

<script type="module" src="/src/main.js"></script>
</body></html>
